name: Status Check
on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

permissions:
  contents: write  # Add this to allow writing to the repo

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check website status
        run: |
          if curl -f https://yellowsam.net > /dev/null 2>&1; then
            echo "{status=online" >> status.txt
          else
            echo "{status=offline" >> status.txt
          fi
      - name: Update status file
        run: |
          status=$(if curl -f https://yellowsam.net > /dev/null 2>&1; then echo "online"; else echo "offline"; fi)
          cat > status.json << EOF
          {
            "status": "$status",
            "lastChecked": "$(date)"
          }
          EOF
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Update status" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
